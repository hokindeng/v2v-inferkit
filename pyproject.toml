[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v2vinferkit"
version = "0.1.0"
description = "Unified inference toolkit for video-to-video generation models"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "requests>=2.31",
    "httpx>=0.27",
    "tenacity>=8.2",
    "runwayml>=3.17.0",
    "fal-client>=0.4",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["v2vinferkit*"]
